name: build

permissions:
  contents: write

on:
  push:
  workflow_dispatch:

jobs:
  loader:
    name: stage-2 loader (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
      - name: Build loader (capture log)
        id: build
        working-directory: loader
        run: make 2>&1 | tee ../build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Push build log to the logs branch (debug channel)
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout -B logs
          git add -f build.log
          git commit -m "build log: $(date -u +%FT%TZ) run ${{ github.run_id }}"
          git push --force origin logs
      - uses: actions/upload-artifact@v4
        with:
          name: loader
          path: loader/loader.bin

  bootimg:
    name: package boot.img
    runs-on: ubuntu-latest
    needs: [loader]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: loader
          path: loader/
      - name: Build XNU payload slot (placeholder while kernel CI is landing)
        run: |
          printf 'NOXNUKERNEL-BRING-UP-PLACEHOLDER' > tools/placeholder-kernel.bin
      - name: Compress loader the way the stock image does
        run: gzip -9 -n -c loader/loader.bin > loader/loader.bin.gz
      - name: Package boot.img (gzip kernel, header v2 + stock dtb + stock ramdisk)
        run: |
          python3 tools/mk_bootimg.py \
            --kernel loader/loader.bin.gz \
            --ramdisk tools/stock-begonia-ramdisk.bin \
            --dtb tools/stock-begonia.dtb \
            --output hackios-begonia-boot.img
      - name: Package boot.img (raw Image kernel, header v2 + stock dtb + stock ramdisk)
        run: |
          python3 tools/mk_bootimg.py \
            --kernel loader/loader.bin \
            --ramdisk tools/stock-begonia-ramdisk.bin \
            --dtb tools/stock-begonia.dtb \
            --output hackios-begonia-boot-raw.img
      - name: Verify packaged images (fails if LK would reject them)
        run: |
          python3 tools/inspect_boot.py hackios-begonia-boot.img
          python3 tools/inspect_boot.py hackios-begonia-boot-raw.img
      - uses: actions/upload-artifact@v4
        with:
          name: hackios-begonia-boot.img
          path: |
            hackios-begonia-boot.img
            hackios-begonia-boot-raw.img

  xnu:
    name: XNU kernel for BEGONIA (experimental)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PowerPointKotik/HackiOS-source
          path: HackiOS-source
      - name: Set up xnu build environment
        run: |
          echo "TODO: xnu-build setup for DEVELOPMENT_BEGONIA.arm64 lands here"
